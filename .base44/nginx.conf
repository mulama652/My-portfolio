# Base44 dev-preview nginx config for this static site.
# Mounted over /etc/nginx/nginx.conf. Based on the nginx:alpine default main
# config, with two deliberate differences:
#   1. The repository root is bind-mounted at /usr/share/nginx/html and the
#      checkout root is mode 0700 root-owned, so the standard `user nginx;`
#      worker (uid 101) cannot traverse it. Workers run as root in this
#      development container so the mounted source is readable.
#   2. Repo internals (.git, .base44, the setup files) are never served.
user  root;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  _;
        root   /usr/share/nginx/html;
        index  index.html;

        # Never publish dotfiles/dot-directories (.git, .base44) ...
        location ~* (^|/)\. {
            deny all;
        }

        # ... nor the Base44 setup files, which are not part of the site.
        location ~* ^/(docker-compose|AGENTS\.md) {
            deny all;
        }

        # Development preview: always take files as they are on disk.
        add_header Cache-Control "no-store" always;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
