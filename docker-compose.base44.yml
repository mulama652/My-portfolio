services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      # Serve the live source straight from the checkout — edits show up on the
      # next request, no image rebuild needed.
      - ./:/usr/share/nginx/html:ro
      # Dev config: hides repo internals, disables caching, and runs the dev
      # workers as root because the checkout root is mode 0700 root-owned.
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -qi '<html'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
